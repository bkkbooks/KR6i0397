body:
  text: 西天譯經三藏朝散大夫試鴻臚少卿明教大師臣法賢奉詔譯如是我聞一時佛在舍衛國祇樹給孤獨園與大苾芻眾說布施法有三十七種一以信重心而行布施當得離眾嫉妬人所崇敬二依時施得三業清淨四時安隱三常行施得身心適悅無散亂失四親手施得手指纖長身相端正五為他施復得他人行大捨施六依教施心離取相得無為福七以妙色具施得身色端嚴眾所愛樂八以上妙香具施恒得旃檀之香受用供養九以上味施得味中上味充益肢體十如法尊重施得安隱快樂眾人喜見十一以廣大心施得無量廣大之福十二以美食施得離飢饉倉庫盈溢十三以漿飲施得所往之處無諸飢渴十四以衣服施得上妙衣莊嚴身相十五以住處施得田宅寬廣樓閣莊嚴十六以臥具施得生貴族資具光潔十七以象馬車輦施得四神足無擁妙用十八以湯藥施得安隱快樂無諸疾病十九以經法施得宿命等通二十以花果施得七覺支花二十一以花鬘施得脫貪瞋癡垢二十二以香施得離煩惱臭穢二十三以傘蓋施得法自在二十四以鈴鐸施得言音美妙二十五以音樂施得梵音深妙二十六以然燈施得天眼清淨二十七以繒綵疋帛施得解脫衣服二十八以香水灑如來塔廟二十九以香水浴如來身三十以香油塗飾佛像共得三十二相八十種好三十一以香水施浴眾僧得富貴家生少病安樂三十二以慈心施得顏貌和悅無諸瞋恨三十三以悲心施得離殺害三十四以喜心施得無所畏遠離憂惱三十五以捨心施得離罣礙證寂滅樂三十六以種種施得種種福三十七以無住無相心施得無上正等正覺佛告諸苾芻如是三十七種智者所行微妙施行汝今受持爾時舍衛國王白佛言世尊我等云何而行布施佛言大王若求勝妙福報而行施時慈心不殺離諸嫉妬正見相應遠於不善堅持禁戒親近善友閉惡趣門開生天路自利利他其心平等若如是施是真布施是大福田復次行施隨自心願獲其報應或以妙色名香珍味軟觸親手布施得眾人尊重眷屬圓滿富貴安樂之報或以飲食布施而得大力或以酥油之燈布施而得天眼或以音樂布施而得天耳或以湯藥布施而得長壽或以住處布施而得樓閣田園或以法說布施而得甘露佛言大王若以十善行施復得十種報應十善者不殺生不偷盜不婬欲不妄語不綺語不惡口不兩舌不貪不瞋不癡而得命不中夭財無散失眷屬清潔所言誠諦離諸嫉妬人所喜見親友和睦不墮貧賤顏貌端正智慧相應獲報如是佛言大王若以上妙飲食供養三寶得五種利益身相端嚴氣力增盛壽命延長快樂安隱成就辯才如是南贍部洲一切眾生父母妻子男女眷屬如上布施隨願所求無不圓滿說此法已皆大歡喜作禮而退
